name: Pilotis verification

on:
  push:
    branches:
      - 'dev/chatgpt'
    paths:
      - '.github/workflows/firestore-confirmation-check.yml'
      - '.github/workflows/ci.yml'
      - 'firestore.rules'
      - 'src/services/pilotisService.ts'
      - 'tests/**'
      - 'src/**'
      - 'server.ts'
      - 'package*.json'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/browser/playwright.config.mjs
