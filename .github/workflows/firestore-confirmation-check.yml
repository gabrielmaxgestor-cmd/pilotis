name: Pilotis verification

on:
  push:
    branches:
      - 'dev/chatgpt'
    paths:
      - '.github/workflows/firestore-confirmation-check.yml'
      - 'firestore.rules'
      - 'src/services/pilotisService.ts'
      - 'tests/**'
      - 'src/**'
      - 'server.ts'
      - 'package*.json'

permissions:
  contents: read

jobs:
  firestore-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run confirmation tests against the named database in the emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-pilotis "node --test tests/firestore.rules.test.mjs"
      - name: Show emulator diagnostics on failure
        if: failure()
        run: |
          if test -f firestore-debug.log; then tail -n 150 firestore-debug.log; fi

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test tests/integration.test.mjs
      - run: npm run build
