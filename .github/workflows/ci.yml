name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    name: Aplicação (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test tests/integration.test.mjs
      - run: npm run build
      - name: Auditar dependências de produção
        if: ${{ !cancelled() }}
        run: |
          if ! npm audit --omit=dev; then
            echo '::warning::npm audit encontrou problemas ou não conseguiu concluir. Consulte a saída desta etapa.'
          fi

  firestore-rules:
    name: Regras do Firestore
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Testar regras com o emulador do Firestore
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-pilotis "node --test tests/firestore.rules.test.mjs"
      - name: Mostrar diagnósticos do emulador
        if: failure()
        run: |
          if test -f firestore-debug.log; then tail -n 150 firestore-debug.log; fi
